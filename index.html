<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leonida Tracker">
  <meta name="description" content="Offline-first GTA VI individual completion tracker with chapter gates, 100% goals and progress backups.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Leonida · Completion Tracker</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" role="banner">
        <div class="brand-mark" aria-hidden="true">L<span>⁄</span></div>
        <div><div class="brand-title">LEONIDA <span>TRACKER</span></div><div class="brand-caption">GTA VI · completion command centre</div></div>
      </div>
      <div class="top-actions">
        <span id="save-status" class="save-status"><span class="live-dot"></span> Saved on this device</span>
        <button class="icon-button" id="quick-backup" title="Export a progress backup" aria-label="Export progress backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg>
        </button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="side-label">YOUR PROGRESS</div>
        <nav id="desktop-nav" class="nav-stack"></nav>
        <div class="sidebar-foot">
          <span class="tiny-label">YOUR CURRENT CHAPTER</span>
          <div id="sidebar-chapter"></div>
          <div class="side-tip">Individual items, not just category totals. Every tick matters.</div>
        </div>
      </aside>
      <main id="app" class="main" tabindex="-1"><div class="initial-loading"><div class="loading-spinner"></div>Loading your checklist…</div></main>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="App tabs"></nav>
  </div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
